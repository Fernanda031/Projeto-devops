name: Rollback

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão estável a restaurar (ex: 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read
  packages: read

jobs:
  rollback-homologacao:
    runs-on: ubuntu-latest
    environment: homologacao
    env:
      VERSAO: ${{ inputs.versao }}
    steps:
      - name: Definir imagem da versão estável
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${REPO}:${VERSAO}" >> "$GITHUB_ENV"

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir banco de homologação
        env:
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          docker network create homolog
          docker run -d --name db --network homolog \
            -e MYSQL_DATABASE=library_db \
            -e MYSQL_USER=library_user \
            -e MYSQL_PASSWORD="$MYSQL_PASSWORD" \
            -e MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            mysql:8.0
          for i in $(seq 1 40); do
            if docker exec db mysqladmin ping -h 127.0.0.1 --silent; then
              echo "Banco pronto"
              exit 0
            fi
            sleep 3
          done
          docker logs db
          exit 1

      - name: Restaurar a versão estável
        env:
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          echo "Restaurando imagem $IMAGE"
          docker run -d --name app --network homolog -p 8000:8000 \
            -e DATABASE_URL="mysql+pymysql://library_user:${MYSQL_PASSWORD}@db:3306/library_db" \
            "$IMAGE"

      - name: Smoke test pós-rollback
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null; then
              echo "Aplicação saudável"
              break
            fi
            if [ "$i" -eq 30 ]; then
              docker logs app
              exit 1
            fi
            sleep 3
          done
          echo "Versão restaurada:"
          curl -fs http://localhost:8000/version
          curl -fs http://localhost:8000/version | grep -q "$VERSAO"

      - name: Limpar ambiente
        if: always()
        run: |
          docker rm -f app db || true
          docker network rm homolog || true